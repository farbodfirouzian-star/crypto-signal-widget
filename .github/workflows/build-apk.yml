name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          unzip -o CryptoSignalWidget-v7.zip -d project
          echo "Project files:"
          find project -name settings.gradle.kts -print
      - name: Force Java 17 target
        run: |
          PROJECT_DIR="$(dirname "$(find "$GITHUB_WORKSPACE/project" -name settings.gradle.kts -print -quit)")"
          APP_FILE="$PROJECT_DIR/app/build.gradle.kts"

          echo "Project directory: $PROJECT_DIR"
          echo "Before fix:"
          grep -n -E 'sourceCompatibility|targetCompatibility|jvmTarget' "$APP_FILE" || true

          sed -i 's/JavaVersion.VERSION_1_8/JavaVersion.VERSION_17/g' "$APP_FILE"
          sed -i 's/jvmTarget = "1.8"/jvmTarget = "17"/g' "$APP_FILE"

          echo "After fix:"
          grep -n -E 'sourceCompatibility|targetCompatibility|jvmTarget' "$APP_FILE"
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Install Android SDK packages
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Build APK
        run: |
          PROJECT_DIR="$(dirname "$(find "$GITHUB_WORKSPACE/project" -name settings.gradle.kts -print -quit)")"
          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: settings.gradle.kts not found"
            exit 1
          fi
          echo "Building in $PROJECT_DIR"
          cd "$PROJECT_DIR"
          sed -i 's/JavaVersion.VERSION_1_8/JavaVersion.VERSION_17/g; s/JavaVersion.VERSION_8/JavaVersion.VERSION_17/g' app/build.gradle.kts
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CryptoSignalWidget-APK
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
